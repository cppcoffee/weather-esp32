name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 同一 tag 的两次发布不能排队抢同一批附件
concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: managed_components
          key: components-v6.0.2-${{ hashFiles('dependencies.lock') }}

      # container 覆盖了镜像 entrypoint，idf.py 不在 PATH，每个用到它的 step 都要 source export.sh
      - name: Build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py build
          idf.py merge-bin

      # 平铺成 dist/，release 里不出现 build 目录层级
      - run: |
          mkdir -p dist
          cp build/merged-binary.bin dist/weather_esp32-${{ github.ref_name }}-merged.bin
          cp build/weather_esp32.bin dist/weather_esp32-${{ github.ref_name }}.bin
          cp build/bootloader/bootloader.bin dist/bootloader.bin
          cp build/partition_table/partition-table.bin dist/partition-table.bin
          cp build/srmodels/srmodels.bin dist/srmodels.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          if-no-files-found: error
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
