name: Build

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: managed_components
          key: components-v6.0.2-${{ hashFiles('dependencies.lock') }}

      # container 覆盖了镜像 entrypoint，idf.py 不在 PATH，每个用到它的 step 都要 source export.sh
      - name: Build
        shell: bash
        run: |
          . "${IDF_PATH:-/opt/esp/idf}/export.sh"
          idf.py build
          idf.py merge-bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/merged-binary.bin
            build/weather_esp32.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/srmodels/srmodels.bin
