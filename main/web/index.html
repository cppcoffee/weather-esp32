<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>连接 Wi-Fi</title>
    <style>{{STYLE}}</style>
</head>
<body>
    <main>
        <h1>连接 Wi-Fi</h1>
        <form method="post" action="/save">
            <div class="row">
                <label for="ssid">网络</label>
                <a id="rescan" href="/">重新扫描</a>
            </div>
            <select id="ssid" name="ssid">{{OPTIONS}}</select>
            <details>
                <summary>手动输入网络名称</summary>
                <input type="text" name="ssid2" aria-label="网络名称" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Wi-Fi 名称">
            </details>
            <label for="pw">密码</label>
            <div class="password">
                <input id="pw" type="password" name="pass" autocomplete="off" placeholder="开放网络留空">
                <button id="eye" type="button" aria-label="显示密码" hidden>
                    <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                        <path d="M2 12s3.6-6.5 10-6.5 10 6.5 10 6.5-3.6 6.5-10 6.5S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                        <path d="M10 5.7a10 10 0 0 1 2-.2c6.4 0 10 6.5 10 6.5a17 17 0 0 1-2.5 3.1m-2.7 2.2a9.8 9.8 0 0 1-4.8 1.2C5.6 18.5 2 12 2 12a17 17 0 0 1 4.1-4.4M3 3l18 18"/>
                    </svg>
                </button>
            </div>
            <section aria-labelledby="voice-title">
                <h2 id="voice-title">语音设置</h2>
                <label for="voice-url">服务信息地址（OTA）</label>
                <input type="url" name="voice_url" id="voice-url" required maxlength="255" value="{{VOICE_URL}}" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="voice-url-help">
                <p class="hint" id="voice-url-help">填写服务电脑的局域网地址，例如 <code>http://192.168.1.2:8000/xiaozhi/ota/</code></p>
            </section>
            <button class="save" type="submit">保存并连接</button>
        </form>
        <footer>{{AP_SSID}} · {{AP_URL}}</footer>
    </main>
    <script>{{SCRIPT}}</script>
</body>
</html>
